name: Forge 1.20.1 Build and Release
on:
  push:
    branches:
      - main  # Trigger on push to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get Version from build.gradle
        id: get_version
        run: |
          echo "VERSION=$(./gradlew properties | grep ^version: | awk '{print $2}')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Release v${{ env.VERSION }}
          # Path to your compiled jar (usually in build/libs)
          # Adjust the glob pattern if your jar name differs
          files: build/libs/mlwborderlinker-${{ env.VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
